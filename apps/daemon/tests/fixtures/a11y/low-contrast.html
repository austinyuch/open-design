<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-contrast fixture</title>
<style>
  :root { --bg: #ffffff; --fg-muted: #a3a3a3; }
  body { background: var(--bg); color: #111111; }
  .note { color: var(--fg-muted); background: var(--bg); }
</style>
</head>
<body>
<main>
  <section data-od-id="status">
    <h1>Release status</h1>
    <p class="note">Last deployed on Tuesday.</p>
  </section>
</main>
</body>
</html>
